    verified: 2026-09-20 (VT-1; docs/s9_robotics_pack.md section 15)
    sub_ontologies:
      corax: clause 6 (CORAX)
      cora: clause 7 (CORA)
      rparts: clause 8 (RPARTS)
      pos: clause 9 (POS)
