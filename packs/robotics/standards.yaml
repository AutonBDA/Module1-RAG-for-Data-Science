# The robotics pack's external standards (plan 4.5, FR11, VT-1) - DATA read
# by the generic tools/file_mapping_draft.py (a pack carries no code and the
# core carries no domain, AR-rag4ds-028 F6). Each standard the pack maps to
# is pinned here by the sha256 of the PI's own copy, placed in data/standards/
# (gitignored) on 2026-09-20; a different file at the path is refused. The
# standards are IEEE copyright and NOT redistributable: the file and its
# extracted text stay outside git, and this registry carries names and
# clause numbers only - no sentence of either text is committed anywhere.
#
# `classes` is the vocabulary a mapping row may name (4.5: one pack entry ->
# one external class); a row naming anything else is refused at filing. The
# list was verified against the text of IEEE Std 1872-2015 on 2026-09-20
# (VT-1; docs/s9_robotics_pack.md section 15): every class below is declared
# by a subclass axiom in the clause given, under the sub-ontology prefix of
# that clause (corax = clause 6, cora = clause 7, rparts = clause 8,
# pos = clause 9). `relations` lists EVERY relation the same clauses
# declare - by a subrelation axiom, or by an axiom typing the term as a
# relation, predicate or function (the two forms the text uses), plus the
# one part role 8.5 declares with a subclass axiom as printed - so that a
# row cannot target one by mistake: the 7.2 part role and the 7.4 autonomy
# roles are relations in the text, not classes. Completed after
# AR-rag4ds-042 r1 F1 (the first sweep stopped inside 9.6 and recorded
# 30 of the 42). No term of clauses 6-9 is deliberately left out.
# `parent` is the SUMO term the axiom names, for orientation only; for a
# relation it is the relation it is declared a subrelation of.
# `spelled` records the axiom's own spelling where it differs from the
# clause heading (the text prints both); `example: true` marks a class the
# clause declares inside a worked example rather than as a normative term.
schema: 1
pack: robotics
raw_dir: data/standards
standards:
  cora-ieee-1872:
    title: IEEE Std 1872-2015 - IEEE Standard Ontologies for Robotics and Automation
    publisher: IEEE
    year: 2015
